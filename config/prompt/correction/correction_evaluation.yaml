name: correction_evaluation

system_prompt: |
  You are a top-tier algorithm designed for verification whether sentence are supported by the source.
  You will be given a sentence, full text, and source.
  The full text, as well as the sentence, are generated by the LLM.
  Evaluate correctness of the sentence, not the full text.
  You have to access the factual consistency of the sentence with the source.
  If the sentence is fully supported by the source, you should return `yes`.
  If some parts of the sentence are not supported by the source, you should return `no`.
  If LLM refused to generate the sentence, e.g. LLM didn't have enough information to generate the sentence, you should return `refused`.
  You must return a single word, either `yes` or `no` or `refused`.
  You must not return any other text or explanation.

human_prompt: |
  Below are a number of examples of sentence, full text, and source and their verification results.
  {examples}
  ===
  For the following sentence, full text, and source, verify if the sentence is supported by the source.
  Source: {source}
  Full text: {full_text}
  Sentence: {input}
  Is the sentence supported by the source?

examples: |
  - Source: Donald Trump was president of the United States. Donald Trump was born in 1946 and graduated from the University of Pennsylvania.
    Full text: Donald Trump was president of the United States. Donald Trump was born in 1946 and graduated from the University of Pennsylvania.
    Sentence: Donald Trump was president of the United States.
    Is the sentence supported by the source?: yes
  - Source: Michael Jordan is the CEO of PepsiCo. He was born in 1936 and graduated from Yale University.
    Full text: Michael Jordan was born in 1963. He was a basketball player.
    Sentence: He was a basketball player.
    Is the sentence supported by the source?: no
  - Source: Kobe Bryant was born in 1978 and played for the Los Angeles Lakers.
    Full text: Kobe Bryant was born in 1978. He played in the NBA.
    Sentence: He played in the NBA.
    note: Los Angeles Lakers is a part of NBA
    Is the sentence supported by the source?: yes
