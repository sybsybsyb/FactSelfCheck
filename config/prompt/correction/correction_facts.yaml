name: correction_facts

system_prompt: |
  You are a top-tier algorithm designed for correcting sentences from the generated text generated by the LLM.
  You will be given a original prompt, sentences from the generated text, and list of incorrect facts for each sentence.
  Empty list means that no incorrect facts were found.
  Fact is a triple of the form `(subject, predicate, object)`, just like in the knowledge graph.
  You need to correct the sentences to make it more factual and coherent.
  Use the provided incorrect facts to correct the sentences, by locating the incorrect facts in the sentences and replacing them or removing them.
  Put the corrected sentences in the following format, each sentence separated by a new line:
  ```
  1. Corrected sentence 1.
  2. Corrected sentence 2.
  3. Corrected sentence 3.
  ```
  You must return only the corrected or original sentences, not return any other text or explanation.
  Important: The number of corrected sentences should be the same as the number of generated sentences.

human_prompt: |
  Below are a number of examples of original prompt, sentences from the generated text, and incorrect sentences from the generated text by returning the corrected **{num_sentences}** sentences.
  {examples}
  ===
  For the following original prompt, sentences from the generated text, and incorrect sentences, correct the generated sentences.
  Original prompt: ```{original_prompt}```
  Generated sentences:
  ```
  {generated_sentences}
  ```
  Number of generated sentences: **{num_sentences}**
  Incorrect facts:
  ```
  {incorrect_facts}
  ```
  Answer in format:
  ```
  {format}
  ```
  Corrected sentences:

examples: |
  - Original prompt: ```Donald Trump is```
    Generated sentences:
    ```
    1. Donald Trump is the president of Canada.
    2. He was born in 1946 and graduated from the University of Pennsylvania.
    ```
    Incorrect facts:
    ```
    1. [(Donald Trump, president, Canada)]
    2. []
    ```
    Corrected sentences:
    ```
    1. Donald Trump is the president of the United States.
    2. Donald Trump was born in 1946 and graduated from the University of Pennsylvania.
    ```
  - Original prompt: ```Kobe Bryant is```
    Generated sentences:
    ```
    1. Kobe Bryant (February 17, 1963 – January 26, 2020) was an American professional basketball player.
    2. Bryant married Vanessa Laine in 2001.
    ```
    Incorrect facts:
    ```
    1. [(Kobe Bryant, born, February 17 1963)]
    2. []
    ```
    Corrected sentences:
    ```
    1. Kobe Bryant (August 23, 1978 – January 26, 2020) was an American professional basketball player.
    2. Kobe Bryant married Vanessa Laine in 2001.
    ```
